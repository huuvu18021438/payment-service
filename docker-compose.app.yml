# Dùng kèm docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d --build
# Build từ source tại máy (CD của GitHub Actions chạy lệnh này trên self-hosted runner).
# iss trong token (lấy qua trình duyệt) là http://localhost:8180/realms/bank, nên KEYCLOAK_ISSUER giữ giá trị đó;
# còn khoá công khai (JWKS) app lấy qua mạng nội bộ compose bằng KEYCLOAK_JWK_SET_URI.
services:
  payment-service:
    build: .
    image: payment-service:local
    depends_on:
      payment-db:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://payment-db:5432/payment
      DB_USERNAME: payment
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      KEYCLOAK_ISSUER: http://localhost:8180/realms/bank
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/bank/protocol/openid-connect/certs
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KC_ADMIN_CLIENT_SECRET}
      APP_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
